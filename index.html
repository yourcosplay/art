---
layout: default
title: "Home - CosShowcase Gallery"
---

<main class="container">
  <!-- Kolom Pencarian Premium (Aman untuk Mobile & Tidak Melar) -->
  <div class="search-wrapper">
    <input type="text" id="cosplaySearch" placeholder="Cari nama cosplayer, karakter, atau tag...">
  </div>

  <!-- Grid Postingan -->
  <section class="homepage-grid">
    {% for post in site.posts %}
      <article class="post-card">
        <a href="{{ post.url | relative_url }}">
          <div class="card-thumb" style="background-image: url('{{ post.featured_image }}');">
            <span class="card-badge">{{ post.category | replace: '-', ' ' | upcase }}</span>
          </div>
          <div class="card-details">
            <h2>{{ post.title }}</h2>
            <span class="card-date">{{ post.date | date: "%d %B %Y" }}</span>
          </div>
        </a>
      </article>
    {% endfor %}
  </section>
</main>

<!-- Script Pencarian Real-Time Instan -->
<script>
  document.getElementById('cosplaySearch').addEventListener('input', function() {
    let filter = this.value.toLowerCase().trim();
    let posts = document.querySelectorAll('.post-card');

    posts.forEach(function(post) {
      let title = post.querySelector('h2').textContent.toLowerCase();
      let badge = post.querySelector('.card-badge').textContent.toLowerCase();
      
      if (title.indexOf(filter) > -1 || badge.indexOf(filter) > -1) {
        post.style.display = ""; // Tampilkan jika cocok
      } else {
        post.style.display = "none"; // Sembunyikan jika tidak cocok
      }
    });
  });
</script>
