---
layout: default
title: "Home - CosShowcase Gallery"
---

<main class="container">
  <!-- Kolom Pencarian Premium -->
  <div class="search-wrapper">
    <input type="text" id="cosplaySearch" placeholder="Cari nama cosplayer, karakter, atau tag...">
  </div>

  <!-- Grid Postingan -->
  <section class="homepage-grid">
    {% for post in site.posts %}
      <article class="post-card" data-category="{{ post.category | slugify }}">
        <a href="{{ post.url | relative_url }}">
          <div class="card-thumb" style="background-image: url('{{ post.featured_image }}');">
            <span class="card-badge">{{ post.category | replace: '-', ' ' | upcase }}</span>
          </div>
          <div class="card-details">
            <h2>{{ post.title }}</h2>
            <span class="card-date">{{ post.date | date: "%d %B %Y" }}</span>
          </div>
        </a>
      </article>
    {% endfor %}
  </section>
</main>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const searchInput = document.getElementById('cosplaySearch');
    const categoryLinks = document.querySelectorAll('.nav-categories a');
    const posts = document.querySelectorAll('.post-card');
    
    // 1. Baca URL saat halaman pertama dimuat untuk melihat apakah ada filter aktif
    const urlParams = new URLSearchParams(window.location.search);
    let currentCategory = urlParams.get('cat') || 'semua';
    let searchQuery = '';

    function filterPosts() {
      posts.forEach(function(post) {
        let postTitle = post.querySelector('h2').textContent.toLowerCase();
        let postCategory = post.getAttribute('data-category');

        let matchSearch = postTitle.includes(searchQuery);
        let matchCategory = (currentCategory === 'semua') || (postCategory === currentCategory);

        if (matchSearch && matchCategory) {
          post.style.display = "";
        } else {
          post.style.display = "none";
        }
      });

      // 2. Update warna tombol menu yang sedang aktif
      categoryLinks.forEach(link => {
        if (link.getAttribute('data-filter') === currentCategory) {
          link.classList.add('active');
        } else {
          link.classList.remove('active');
        }
      });
    }

    // Jalankan penyaringan otomatis saat masuk ke halaman utama
    filterPosts();

    // 3. Event Kolom Pencarian
    if (searchInput) {
      searchInput.addEventListener('input', function() {
        searchQuery = this.value.toLowerCase().trim();
        filterPosts();
      });
    }

    // 4. Event Klik Kategori (Instan tanpa reload jika sudah di halaman utama)
    categoryLinks.forEach(function(link) {
      link.addEventListener('click', function(e) {
        if (window.location.pathname === '/' || window.location.pathname === '/index.html' || window.location.pathname === '/art/') {
          e.preventDefault();
          currentCategory = this.getAttribute('data-filter');
          
          // Ubah URL secara visual tanpa memuat ulang halaman (lebih elegan)
          const newUrl = currentCategory === 'semua' ? '/' : '/?cat=' + currentCategory;
          window.history.pushState({}, '', newUrl);
          
          filterPosts();
        }
      });
    });
  });
</script>
